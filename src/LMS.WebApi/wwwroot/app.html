<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Athenaeum LMS</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">L</div>
        <div>
          <div class="brand-title">Athenaeum LMS</div>
          <div id="sidebar-role" class="sidebar-role"></div>
        </div>
      </div>

      <ul id="nav-list" class="nav-list"></ul>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div id="user-name" class="user-chip-name"></div>
          <div id="user-meta" class="user-chip-meta"></div>
        </div>
        <button id="logout-btn" type="button" class="btn btn-secondary btn-sm btn-block">Sign Out</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <h1 id="page-title">Loading...</h1>
        <div id="topbar-actions"></div>
      </header>

      <main id="page-content" class="page-content"></main>
    </div>
  </div>

  <div id="modal-root" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
