<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Library Management System</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">
      <div class="brand-icon">L</div>
      <div class="brand-title">Athenaeum LMS</div>
    </div>

    <h1>Sign in to your account</h1>
    <p class="auth-subtitle">Access your role-based library workspace.</p>

    <div id="login-alert" class="alert alert-error hidden" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" class="form-control" placeholder="Enter your username" autocomplete="username" />
        <div id="username-error" class="field-error"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" />
        <div id="password-error" class="field-error"></div>
      </div>

      <button id="login-btn" type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="demo-accounts">
      <p>Quick-Fill Demo Accounts</p>
      <div class="demo-grid">
        <button type="button" class="btn btn-secondary btn-sm" data-demo-user="admin" data-demo-pass="Admin@123">Administrator</button>
        <button type="button" class="btn btn-secondary btn-sm" data-demo-user="librarian" data-demo-pass="Librarian@123">Librarian</button>
        <button type="button" class="btn btn-secondary btn-sm" data-demo-user="member1" data-demo-pass="Member@123">Member 1 (Alice)</button>
        <button type="button" class="btn btn-secondary btn-sm" data-demo-user="member2" data-demo-pass="Member@123">Member 2 (Bob)</button>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
